name: MLOps Governance & CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      model_version:
        description: 'Model Version to Promote'
        required: true
        default: 'latest'

jobs:
  validate-and-lint:
    name: Code & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Pipeline Syntax & Type Checking
        run: |
          python -m py_compile pipelines/training_pipeline.py
          python -m py_compile pipelines/deployment_pipeline.py
          python -m py_compile src/model_registry.py
          python -m py_compile src/audit_logger.py

  train-and-evaluate:
    name: Model Training & Evaluation Gate
    needs: validate-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Training & Audit Trail Logging
        run: |
          python pipelines/training_pipeline.py --experiment-name "governance-audit-demo" --validate-gates

  promote-staging:
    name: Staging Promotion Gate
    needs: train-and-evaluate
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Promote Model to Staging Registry
        run: |
          python pipelines/deployment_pipeline.py --target-env staging --approval-status auto-approved

  promote-production:
    name: Production Promotion Gate (Manual Sign-off)
    needs: promote-staging
    if: github.event.inputs.target_environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Validate Compliance Sign-off & Promote to Production
        run: |
          python pipelines/deployment_pipeline.py --target-env production --require-audit-signoff
